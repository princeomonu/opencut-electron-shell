name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check tag matches package version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"
          echo "value=$package_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            command: pnpm exec electron-builder --linux AppImage deb --x64 --publish never
            artifact: linux-x64
            files: |
              dist/*.AppImage
              dist/*.deb
          - name: Windows x64
            runner: windows-2022
            command: pnpm exec electron-builder --win nsis zip --x64 --publish never
            artifact: windows-x64
            files: |
              dist/*.exe
              dist/*.zip
          - name: macOS x64 and arm64
            runner: macos-14
            command: >
              pnpm exec electron-builder --mac dmg zip --x64 --publish never &&
              pnpm exec electron-builder --mac dmg zip --arm64 --publish never
            artifact: macos
            files: |
              dist/*.dmg
              dist/*.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes
          fi
